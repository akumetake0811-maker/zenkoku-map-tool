<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四国地方の市区町村マップ 色分けツール(白地図)</title>
<meta name="description" content="四国地方の都道府県を選んで、市区町村を自由に色分けできる無料の白地図ツールです。訪れた場所の記録や旅行の計画、学習用の白地図としても使えます。">
<style>
  :root{
    --bg:#f7f5f0;
    --panel:#ffffff;
    --border:#d8d3c8;
    --text:#4a4238;
    --accent:#c98a5e;
    --accent-dark:#a8663f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  #card{
    max-width:640px;
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 8px 28px rgba(0,0,0,0.08);
    padding:32px 36px 36px;
  }
  #backLink{
    display:inline-block;
    margin-bottom:14px;
    font-size:12.5px;
    color:#8a8071;
    text-decoration:none;
  }
  #backLink:hover{color:var(--accent-dark);}
  h1{
    font-size:22px;
    margin:0 0 6px;
    color:var(--accent-dark);
  }
  p.lead{
    font-size:13.5px;
    line-height:1.7;
    color:#8a8071;
    margin:0 0 26px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  a.prefcard{
    display:block;
    text-decoration:none;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 16px;
    background:#faf8f3;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  a.prefcard:hover{
    background:#fff;
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(0,0,0,0.08);
    border-color:var(--accent);
  }
  a.prefcard .pname{
    font-size:16px;
    font-weight:600;
    color:var(--accent-dark);
    display:block;
    margin-bottom:4px;
  }
  a.prefcard .pcount{
    font-size:11.5px;
    color:#a89c8a;
  }
  footer{
    margin-top:28px;
    font-size:11px;
    color:#b0a696;
    line-height:1.6;
  }
</style>
</head>
<body>
<div id="card">
  <a id="backLink" href="index.html">← 地方選択に戻る</a>
  <h1>四国地方</h1>
  <p class="lead">都道府県を選ぶと、市区町村ごとに塗り分けられる詳細マップが開きます。</p>
  <div class="grid">
    <a class="prefcard" href="map_tokushima.html"><span class="pname">徳島県</span><span class="pcount">24市区町村</span></a>
    <a class="prefcard" href="map_kagawa.html"><span class="pname">香川県</span><span class="pcount">17市区町村</span></a>
    <a class="prefcard" href="map_ehime.html"><span class="pname">愛媛県</span><span class="pcount">20市区町村</span></a>
    <a class="prefcard" href="map_kochi.html"><span class="pname">高知県</span><span class="pcount">34市区町村</span></a>
  </div>
  <footer>日本地図マップ 色分けツール</footer>
</div>
</body>
</html>
