<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>岩手県マップ色分けツール</title>
<style>
  :root{
    --bg:#f7f5f0;
    --panel:#ffffff;
    --border:#d8d3c8;
    --text:#4a4238;
    --accent:#c98a5e;
    --accent-dark:#a8663f;
    --label-scale:1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    height:100vh;
    overflow:hidden;
  }
  #mapPane{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    overflow:auto;
    background:
      radial-gradient(circle at 20% 20%, #fffdf8 0%, var(--bg) 70%);
  }
  #mapSvg{
    background:#fdfcf8;
    border:1px solid var(--border);
    border-radius:8px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
    width:100%;
    height:100%;
    max-width:100%;
    max-height:100%;
    cursor:grab;
    touch-action:none;
  }
  #mapSvg.panning{
    cursor:grabbing;
  }
  .muni.cur{
    fill:#eef0e8;
    stroke:#6b6355;
    stroke-width:0.7;
    cursor:pointer;
    transition:fill 0.15s ease;
  }
  .muni.cur:hover{
    filter:brightness(0.94);
  }
  .muni.old{
    fill:transparent;
    stroke:#c0392b;
    stroke-width:0.9;
    stroke-dasharray:2.5,2;
    cursor:pointer;
    pointer-events:all;
    transition:fill 0.15s ease;
  }
  .muni.old:hover{
    filter:brightness(0.9);
  }
  body.hide-old .muni.old{
    stroke:transparent;
  }
  .muni.flash{
    stroke:#1a73e8 !important;
    stroke-width:2.5 !important;
  }
  .label{
    pointer-events:none;
    text-anchor:middle;
    dominant-baseline:middle;
    font-family:inherit;
    paint-order:stroke;
    stroke:#fdfcf8;
    stroke-width:calc(2.4px * var(--label-scale));
    stroke-linejoin:round;
  }
  .label.cur{
    font-size:calc(16px * var(--label-scale));
    font-weight:600;
    fill:#4a4238;
  }
  .label.old{
    font-size:calc(10px * var(--label-scale));
    font-weight:600;
    fill:#a8321f;
  }
  body.hide-cur-labels .label.cur{display:none;}
  body.hide-old-labels .label.old{display:none;}
  #sidebar{
    width:300px;
    min-width:300px;
    background:var(--panel);
    border-left:1px solid var(--border);
    padding:14px 14px 24px;
    overflow-y:auto;
  }
  #sidebar h1{
    font-size:16px;
    margin:2px 0 4px;
    color:var(--accent-dark);
  }
  #sidebar p.hint{
    font-size:11.5px;
    line-height:1.6;
    color:#8a8071;
    margin:0 0 14px;
  }
  .section{
    margin-bottom:16px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    background:#fffefb;
  }
  .section h2{
    font-size:12.5px;
    margin:0 0 8px;
    color:var(--accent-dark);
    letter-spacing:0.02em;
  }
  #palette{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .swatch{
    width:26px;height:26px;
    border-radius:50%;
    border:2px solid #fff;
    outline:1px solid var(--border);
    cursor:pointer;
    padding:0;
  }
  .swatch.selected{
    outline:2px solid var(--accent-dark);
    transform:scale(1.12);
  }
  #customColorRow{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:4px;
  }
  #customColor{
    width:34px;height:26px;border:1px solid var(--border);border-radius:6px;padding:0;cursor:pointer;
  }
  #currentColorLabel{
    font-size:11px;color:#8a8071;
  }
  .toolbtn{
    width:100%;
    padding:8px 10px;
    margin-bottom:6px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#faf8f3;
    color:var(--text);
    font-size:12.5px;
    cursor:pointer;
    text-align:left;
  }
  .toolbtn:hover{background:#f1ede3;}
  .toolbtn.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent-dark);
  }
  #eraserBtn.active{background:#8a8071;border-color:#6b6355;color:#fff;}
  label.chk{
    display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;color:#6b6355;
  }
  .listgrid{
    display:flex;flex-wrap:wrap;gap:5px;
  }
  .listbtn{
    font-size:11.5px;
    padding:4px 8px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#faf8f3;
    cursor:pointer;
    color:var(--text);
  }
  .listbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent-dark);}
  .citygroup{
    border-top:1px dashed var(--border);
    padding-top:6px;
    margin-top:6px;
  }
  .citygroup summary{
    font-size:12px;
    cursor:pointer;
    color:var(--accent-dark);
    font-weight:bold;
    margin-bottom:4px;
  }
  .oldbtns{
    display:flex;flex-wrap:wrap;gap:5px;
    margin-top:4px;
  }
  .oldbtn{border-color:#e0b3a6;}
  .oldbtn:hover{background:#c0392b;border-color:#a8321f;}
  .sliderRow{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
    font-size:12px;
    color:#6b6355;
  }
  .sliderLabel{
    white-space:nowrap;
  }
  #labelSizeSlider{
    flex:1;
    accent-color:var(--accent-dark);
  }
  #labelSizeValue{
    width:38px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .zoomrow{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .zbtn{
    width:auto;
    flex:1 1 auto;
    margin-bottom:0;
    text-align:center;
    white-space:nowrap;
  }
  #exportBtn{
    background:var(--accent-dark);
    color:#fff;
    border-color:var(--accent-dark);
  }
  #exportBtn:hover{background:#8c5330;}
</style>
</head>

  <p class="hint">色を選んでから、地図または下のボタンをクリックすると塗りつぶせます。旧市町村は市名の中の枠をクリック、または一覧から選べます。</p>

  <div class="section">
    <h2>① 色を選ぶ</h2>
    <div id="palette"></div>
    <div id="customColorRow">
      <input type="color" id="customColor" value="#ffd966">
      <span id="currentColorLabel">現在の色</span>
    </div>
  </div>

  <div class="section">
    <h2>② 塗る / 消す</h2>
    <button class="toolbtn active" id="paintModeBtn">🖌 塗るモード(選択中)</button>
    <button class="toolbtn" id="eraserBtn">🧹 消しゴムモード</button>
    <button class="toolbtn" id="resetBtn">↺ 全部リセット</button>
    <label class="chk"><input type="checkbox" id="toggleOld" checked> 旧市町村の枠線を表示</label>
    <label class="chk"><input type="checkbox" id="toggleCurLabels" checked> 現行市町村名を表示</label>
    <label class="chk"><input type="checkbox" id="toggleOldLabels"> 旧市町村名を表示</label>
    <div class="sliderRow">
      <label for="labelSizeSlider" class="sliderLabel">文字サイズ</label>
      <input type="range" id="labelSizeSlider" min="0.5" max="2.5" step="0.1" value="1">
      <span id="labelSizeValue">100%</span>
    </div>
  </div>

  <div class="section">
    <h2>③ 表示操作</h2>
    <div class="zoomrow">
      <button class="toolbtn zbtn" id="zoomInBtn">🔍＋ 拡大</button>
      <button class="toolbtn zbtn" id="zoomOutBtn">🔍－ 縮小</button>
      <button class="toolbtn zbtn" id="zoomResetBtn">⤾ 表示リセット</button>
    </div>
    <p class="hint" style="margin:6px 0 0;">マウスホイールで拡大縮小、ドラッグで移動できます。</p>
  </div>

  <div class="section">
    <h2>④ 現行33市町村から選ぶ</h2>
    <div class="listgrid"><button class="listbtn" data-target="cur_03201">盛岡市</button><button class="listbtn" data-target="cur_03202">宮古市</button><button class="listbtn" data-target="cur_03203">大船渡市</button><button class="listbtn" data-target="cur_03205">花巻市</button><button class="listbtn" data-target="cur_03206">北上市</button><button class="listbtn" data-target="cur_03207">久慈市</button><button class="listbtn" data-target="cur_03208">遠野市</button><button class="listbtn" data-target="cur_03209">一関市</button><button class="listbtn" data-target="cur_03210">陸前高田市</button><button class="listbtn" data-target="cur_03211">釜石市</button><button class="listbtn" data-target="cur_03213">二戸市</button><button class="listbtn" data-target="cur_03214">八幡平市</button><button class="listbtn" data-target="cur_03215">奥州市</button><button class="listbtn" data-target="cur_03216">滝沢市</button><button class="listbtn" data-target="cur_03301">雫石町</button><button class="listbtn" data-target="cur_03302">葛巻町</button><button class="listbtn" data-target="cur_03303">岩手町</button><button class="listbtn" data-target="cur_03321">紫波町</button><button class="listbtn" data-target="cur_03322">矢巾町</button><button class="listbtn" data-target="cur_03366">西和賀町</button><button class="listbtn" data-target="cur_03381">金ケ崎町</button><button class="listbtn" data-target="cur_03402">平泉町</button><button class="listbtn" data-target="cur_03441">住田町</button><button class="listbtn" data-target="cur_03461">大槌町</button><button class="listbtn" data-target="cur_03482">山田町</button><button class="listbtn" data-target="cur_03483">岩泉町</button><button class="listbtn" data-target="cur_03484">田野畑村</button><button class="listbtn" data-target="cur_03485">普代村</button><button class="listbtn" data-target="cur_03501">軽米町</button><button class="listbtn" data-target="cur_03503">野田村</button><button class="listbtn" data-target="cur_03506">九戸村</button><button class="listbtn" data-target="cur_03507">洋野町</button><button class="listbtn" data-target="cur_03524">一戸町</button></div>

  <div class="section">
    <h2>⑤ 旧市町村(合併前)から選ぶ</h2>
    <details class="citygroup"><summary>盛岡市</summary><div class="oldbtns"><button class="listbtn oldbtn" data-target="old_03323">都南</button><button class="listbtn oldbtn" data-target="old_03307">玉山</button></div></details><details class="citygroup"><summary>花巻市</summary><div class="oldbtns"><button class="listbtn oldbtn" data-target="old_03341">大迫</button><button class="listbtn oldbtn" data-target="old_03342">石鳥谷</button><button class="listbtn oldbtn" data-target="old_03361">東和</button></div></details><details class="citygroup"><summary>北上市</summary><div class="oldbtns"><button class="listbtn oldbtn" data-target="old_03362">和賀町</button></div></details><details class="citygroup"><summary>奥州市</summary><div class="oldbtns"><button class="listbtn oldbtn" data-target="old_03212">江刺</button><button class="listbtn oldbtn" data-target="old_03383">胆沢</button><button class="listbtn oldbtn" data-target="old_03384">衣川</button></div></details><details class="citygroup"><summary>一関市</summary><div class="oldbtns"><button class="listbtn oldbtn" data-target="old_03401">花泉</button><button class="listbtn oldbtn" data-target="old_03421">大東</button><button class="listbtn oldbtn" data-target="old_03423">千厩</button><button class="listbtn oldbtn" data-target="old_03424">東山</button><button class="listbtn oldbtn" data-target="old_03425">室根</button><button class="listbtn oldbtn" data-target="old_03426">川崎</button><button class="listbtn oldbtn" data-target="old_03422">藤沢</button></div></details><details class="citygroup"><summary>宮古市</summary><div class="oldbtns"><button class="listbtn oldbtn" data-target="old_03481">田老</button><button class="listbtn oldbtn" data-target="old_03487">川井</button></div></details><details class="citygroup"><summary>久慈市</summary><div class="oldbtns"><button class="listbtn oldbtn" data-target="old_03504">山形</button></div></details>

  <div class="section">
    <h2>⑥ 書き出し</h2>
    <label class="chk"><input type="checkbox" id="exportCurrentView"> 表示中の範囲だけを書き出す</label>
    <button class="toolbtn" id="exportBtn">🖼 PNG画像として保存</button>
  </div>
</div>

<script>
(function(){
  var SVG_W = 1800, SVG_H = 2779.9858882505773;

  var PALETTE = [
    "#e57373","#f2a65a","#f7d060","#a3d977","#6bbf8e",
    "#5fb3c9","#6d9de8","#9e86d6","#d18ac4","#c9a06b",
    "#b0b0b0","#ffffff"
  ];

  var state = {
    color: "#ffd966",
    eraser: false
  };

  var paletteEl = document.getElementById('palette');
  PALETTE.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'swatch';
    b.style.background = c;
    b.dataset.color = c;
    b.title = c;
    b.addEventListener('click', function(){
      selectColor(c);
    });
    paletteEl.appendChild(b);
  });

  var customColor = document.getElementById('customColor');
  customColor.addEventListener('input', function(){
    selectColor(customColor.value);
  });

  function selectColor(c){
    state.color = c;
    state.eraser = false;
    document.querySelectorAll('.swatch').forEach(function(s){
      s.classList.toggle('selected', s.dataset.color.toLowerCase() === c.toLowerCase());
    });
    updateModeButtons();
  }

  var paintModeBtn = document.getElementById('paintModeBtn');
  var eraserBtn = document.getElementById('eraserBtn');
  paintModeBtn.addEventListener('click', function(){
    state.eraser = false;
    updateModeButtons();
  });
  eraserBtn.addEventListener('click', function(){
    state.eraser = true;
    updateModeButtons();
  });
  function updateModeButtons(){
    paintModeBtn.classList.toggle('active', !state.eraser);
    eraserBtn.classList.toggle('active', state.eraser);
  }

  document.getElementById('resetBtn').addEventListener('click', function(){
    if(!confirm('すべての色塗りをリセットします。よろしいですか？')) return;
    document.querySelectorAll('.muni').forEach(function(p){
      p.style.fill = '';
    });
  });

  document.getElementById('toggleOld').addEventListener('change', function(e){
    document.body.classList.toggle('hide-old', !e.target.checked);
  });
  document.getElementById('toggleCurLabels').addEventListener('change', function(e){
    document.body.classList.toggle('hide-cur-labels', !e.target.checked);
  });
  document.getElementById('toggleOldLabels').addEventListener('change', function(e){
    document.body.classList.toggle('hide-old-labels', !e.target.checked);
  });

  var labelSizeSlider = document.getElementById('labelSizeSlider');
  var labelSizeValue = document.getElementById('labelSizeValue');
  labelSizeSlider.addEventListener('input', function(e){
    var v = parseFloat(e.target.value);
    document.documentElement.style.setProperty('--label-scale', v);
    labelSizeValue.textContent = Math.round(v * 100) + '%';
  });

  // ---- ズーム・パン(viewBox操作) ----
  var svgEl = document.getElementById('mapSvg');
  var vb = {x:0, y:0, w:SVG_W, h:SVG_H};
  var MIN_VB_W = SVG_W / 25;
  var MAX_VB_W = SVG_W;

  function updateViewBox(){
    svgEl.setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h);
  }

  function clientToSvgPoint(clientX, clientY){
    var pt = svgEl.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    var ctm = svgEl.getScreenCTM();
    if(!ctm) return {x: vb.x + vb.w/2, y: vb.y + vb.h/2};
    var sp = pt.matrixTransform(ctm.inverse());
    return {x: sp.x, y: sp.y};
  }

  function zoomAt(factor, cx, cy){
    var newW = Math.max(MIN_VB_W, Math.min(MAX_VB_W, vb.w * factor));
    factor = newW / vb.w;
    var newH = vb.h * factor;
    vb.x = cx - (cx - vb.x) * factor;
    vb.y = cy - (cy - vb.y) * factor;
    vb.w = newW;
    vb.h = newH;
    updateViewBox();
  }

  svgEl.addEventListener('wheel', function(e){
    e.preventDefault();
    var factor = e.deltaY < 0 ? 0.88 : (1/0.88);
    var p = clientToSvgPoint(e.clientX, e.clientY);
    zoomAt(factor, p.x, p.y);
  }, {passive:false});

  document.getElementById('zoomInBtn').addEventListener('click', function(){
    zoomAt(0.75, vb.x + vb.w/2, vb.y + vb.h/2);
  });
  document.getElementById('zoomOutBtn').addEventListener('click', function(){
    zoomAt(1/0.75, vb.x + vb.w/2, vb.y + vb.h/2);
  });
  document.getElementById('zoomResetBtn').addEventListener('click', function(){
    vb = {x:0, y:0, w:SVG_W, h:SVG_H};
    updateViewBox();
  });

  var isPanning = false, panStart = null, vbStart = null;
  svgEl.addEventListener('pointerdown', function(e){
    if(e.button !== 0) return;
    isPanning = true;
    panStart = {x:e.clientX, y:e.clientY};
    vbStart = {x:vb.x, y:vb.y};
    svgEl.classList.add('panning');
  });
  window.addEventListener('pointermove', function(e){
    if(!isPanning) return;
    var dx = e.clientX - panStart.x;
    var dy = e.clientY - panStart.y;
    var scale = vb.w / svgEl.clientWidth;
    vb.x = vbStart.x - dx * scale;
    vb.y = vbStart.y - dy * scale;
    updateViewBox();
  });
  function endPan(){
    isPanning = false;
    svgEl.classList.remove('panning');
  }
  window.addEventListener('pointerup', endPan);
  window.addEventListener('pointercancel', endPan);

  function applyPaint(el){
    if(state.eraser){
      el.style.fill = '';
    } else {
      el.style.fill = state.color;
    }
  }

  document.querySelectorAll('.muni').forEach(function(p){
    p.addEventListener('click', function(e){
      e.stopPropagation();
      applyPaint(p);
    });
  });

  function flash(el){
    el.classList.add('flash');
    setTimeout(function(){ el.classList.remove('flash'); }, 500);
  }

  document.querySelectorAll('.listbtn').forEach(function(btn){
    var targetId = btn.dataset.target;
    btn.addEventListener('click', function(){
      var el = document.getElementById(targetId);
      if(el){
        applyPaint(el);
        el.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
        flash(el);
      }
    });
    btn.addEventListener('mouseenter', function(){
      var el = document.getElementById(targetId);
      if(el) el.classList.add('flash');
    });
    btn.addEventListener('mouseleave', function(){
      var el = document.getElementById(targetId);
      if(el) el.classList.remove('flash');
    });
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    var useCurrentView = document.getElementById('exportCurrentView').checked;
    var ev = useCurrentView
      ? {x: vb.x, y: vb.y, w: vb.w, h: vb.h}
      : {x: 0, y: 0, w: SVG_W, h: SVG_H};

    var svg = document.getElementById('mapSvg');
    var clone = svg.cloneNode(true);
    clone.setAttribute('width', ev.w);
    clone.setAttribute('height', ev.h);
    clone.setAttribute('viewBox', ev.x + ' ' + ev.y + ' ' + ev.w + ' ' + ev.h);

    // 書き出したSVGは独立した画像として描画されるため、ページ側のCSSは効かない。
    // 見た目に必要なスタイルをSVG自身に埋め込む。
    var scaleNum = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--label-scale')) || 1;
    var styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    styleEl.textContent =
      '.muni.cur{fill:#eef0e8;stroke:#6b6355;stroke-width:0.7;}' +
      '.muni.old{fill:transparent;stroke:#c0392b;stroke-width:0.9;stroke-dasharray:2.5,2;}' +
      '.label{text-anchor:middle;dominant-baseline:middle;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;paint-order:stroke;stroke:#fdfcf8;stroke-linejoin:round;}' +
      '.label.cur{font-size:' + (16 * scaleNum) + 'px;font-weight:600;fill:#4a4238;stroke-width:' + (2.4 * scaleNum) + 'px;}' +
      '.label.old{font-size:' + (10 * scaleNum) + 'px;font-weight:600;fill:#a8321f;stroke-width:' + (2.4 * scaleNum) + 'px;}';
    clone.insertBefore(styleEl, clone.firstChild);

    if(document.body.classList.contains('hide-old')){
      clone.querySelectorAll('.muni.old').forEach(function(p){ p.style.stroke = 'transparent'; });
    }
    if(document.body.classList.contains('hide-cur-labels')){
      clone.querySelectorAll('.label.cur').forEach(function(t){ t.style.display = 'none'; });
    }
    if(document.body.classList.contains('hide-old-labels')){
      clone.querySelectorAll('.label.old').forEach(function(t){ t.style.display = 'none'; });
    }
    var svgData = new XMLSerializer().serializeToString(clone);
    var svgBlob = new Blob(['<?xml version="1.0" standalone="no"?>\r\n' + svgData], {type:'image/svg+xml;charset=utf-8'});
    var url = URL.createObjectURL(svgBlob);
    var img = new Image();
    img.onload = function(){
      var scale = Math.max(2, 1400 / ev.w);
      var canvas = document.createElement('canvas');
      canvas.width = ev.w * scale;
      canvas.height = ev.h * scale;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(function(blob){
        var link = document.createElement('a');
        link.download = '岩手県マップ.png';
        link.href = URL.createObjectURL(blob);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
    };
    img.onerror = function(err){
      alert('PNG書き出しに失敗しました。ブラウザのセキュリティ制限の可能性があります。');
    };
    img.src = url;
  });

  selectColor(state.color);
})();
</script>
</body>
</html>
